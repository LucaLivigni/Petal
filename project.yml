name: Petal
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
options:
  bundleIdPrefix: com.lucagiannilivigni
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Petal:
    type: application
    platform: macOS
    sources:
      - path: Sources/Petal
        excludes:
          - "Resources/Engines/**"
      # Helper programs (ffmpeg, cwebp) are copied as a folder so they land in Contents/Resources/Engines.
      - path: Sources/Petal/Resources/Engines
        type: folder
    postBuildScripts:
      - name: Sign bundled engines
        basedOnDependencyAnalysis: false
        script: |
          ENGINES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Engines"
          for tool in ffmpeg cwebp; do
            [ -f "$ENGINES/$tool" ] && codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$ENGINES/$tool"
          done
          exit 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucagiannilivigni.petal
        PRODUCT_NAME: Petal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Petal"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Petal asks Keynote, Pages and Numbers to convert slides, documents and spreadsheets, and opens folders in Terminal."
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  PetalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PetalTests
    dependencies:
      - target: Petal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Petal.app/Contents/MacOS/Petal"
